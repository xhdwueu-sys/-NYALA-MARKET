<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="نيالا ماركت — سوق سوداني لشراء وبيع السيارات والعقارات والهواتف والأثاث والخدمات.">
<meta name="theme-color" content="#142d45">
<title>نيالا ماركت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#172f45;line-height:1.6}header{background:#142d45;color:#fff;padding:20px;text-align:center}header h1{margin:0}header p{color:#dce8f1}.main{max-width:950px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#142d45,#2878a8);color:#fff;padding:25px;border-radius:16px}.search{margin:15px 0}.categories,.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.category,.ad,form{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #142d4510}.category{text-align:center;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s}.category:hover,.category.active{border-color:#e7ad48;transform:translateY(-2px)}.ad h3{margin:8px 0}.price{color:#2878a8;font-weight:bold}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ddd;border-radius:9px;width:100%;margin:6px 0}textarea{min-height:110px;resize:vertical}button{background:#e7ad48;color:#142d45;border:0;font-weight:bold;cursor:pointer}button:hover{background:#f0bd60}.contact{display:inline-block;margin-top:8px;color:#087e55;font-weight:bold}form{margin:20px 0}.empty{grid-column:1/-1;color:#667;text-align:center}footer{text-align:center;padding:25px;color:#777}@media(max-width:480px){.main{padding:12px}.hero{padding:19px}}
</style>
</head>
<body>
<header>
<h1>🛍️ نيالا ماركت</h1>
<p>سوقك السوداني — اشترِ وبِع بسهولة</p>
</header>
<main class="main">
<section class="hero">
<h2>كل ما تبحث عنه في مكان واحد</h2>
<p>سيارات، عقارات، هواتف، أثاث وخدمات في نيالا والسودان.</p>
</section>

<input class="search" id="search" type="search" placeholder="ابحث عن إعلان..." aria-label="ابحث عن إعلان">

<h2>الأقسام</h2>
<div class="categories" id="categories"></div>

<h2>أحدث الإعلانات</h2>
<div class="ads" id="ads" aria-live="polite"></div>

<h2>أضف إعلانك</h2>
<form id="form">
<label for="title">عنوان الإعلان</label>
<input id="title" placeholder="عنوان الإعلان" required minlength="3">
<label for="category">القسم</label>
<select id="category">
<option>السيارات</option><option>الإلكترونيات</option>
<option>العقارات</option><option>المنزل والأثاث</option>
<option>الأزياء</option><option>المعدات</option><option>الخدمات</option>
</select>
<label for="description">وصف الإعلان</label>
<textarea id="description" placeholder="وصف الإعلان" required></textarea>
<label for="price">السعر بالجنيه السوداني</label>
<input id="price" type="number" min="0" placeholder="السعر بالجنيه السوداني">
<label for="city">المدينة</label>
<input id="city" placeholder="المدينة" value="نيالا" required>
<label for="phone">رقم التواصل (مع رمز الدولة لواتساب)</label>
<input id="phone" type="tel" placeholder="رقم التواصل" required>
<button type="submit">نشر الإعلان</button>
</form>
</main>
<footer>© نيالا ماركت — سوقك في مكان واحد</footer>

<script>
'use strict';
const defaults = [
  {title:'سيارة تويوتا للبيع',category:'السيارات',description:'سيارة بحالة جيدة',price:8500000,city:'نيالا',phone:''},
  {title:'هاتف سامسونج',category:'الإلكترونيات',description:'هاتف مستعمل بحالة ممتازة',price:450000,city:'نيالا',phone:''},
  {title:'منزل للإيجار',category:'العقارات',description:'منزل مناسب للعائلات',price:200000,city:'نيالا',phone:''}
];
const categoryNames = ['السيارات','الإلكترونيات','العقارات','المنزل والأثاث','الأزياء','المعدات','الخدمات'];
const categoryIcons = ['🚘','📱','🏠','🛋️','👕','🧰','🛠️'];
const storageKey = 'nyala_ads';
let ads;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  ads = Array.isArray(saved) ? saved : defaults;
} catch {
  ads = defaults;
}
let selected = '';
const categoriesElement = document.getElementById('categories');
const adsElement = document.getElementById('ads');
const searchElement = document.getElementById('search');
const form = document.getElementById('form');

categoriesElement.innerHTML = categoryNames.map((name, i) =>
  `<button type="button" class="category" data-category="${name}" aria-pressed="false">${categoryIcons[i]} ${name}</button>`
).join('');
categoriesElement.addEventListener('click', event => {
  const button = event.target.closest('[data-category]');
  if (!button) return;
  selected = selected === button.dataset.category ? '' : button.dataset.category;
  categoriesElement.querySelectorAll('[data-category]').forEach(item => {
    const active = item.dataset.category === selected;
    item.classList.toggle('active', active);
    item.setAttribute('aria-pressed', String(active));
  });
  render();
});
searchElement.addEventListener('input', render);

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function render() {
  const query = searchElement.value.trim().toLocaleLowerCase();
  const list = ads.filter(ad => (!selected || ad.category === selected) &&
    [ad.title, ad.description, ad.city, ad.category].join(' ').toLocaleLowerCase().includes(query));
  adsElement.innerHTML = list.length ? list.map(ad => `
    <article class="ad">
      <h3>${escapeHTML(ad.title)}</h3>
      <p>${escapeHTML(ad.category)} • ${escapeHTML(ad.city)}</p>
      <p>${escapeHTML(ad.description)}</p>
      <div class="price">${Number(ad.price || 0).toLocaleString('ar')} ج.س</div>
      ${ad.phone ? `<a class="contact" href="https://wa.me/${escapeHTML(String(ad.phone).replace(/\D/g,''))}" target="_blank" rel="noopener noreferrer">تواصل مع البائع عبر واتساب</a>` : ''}
    </article>`).join('') : '<p class="empty">لا توجد إعلانات مطابقة.</p>';
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const title = document.getElementById('title');
  const category = document.getElementById('category');
  const description = document.getElementById('description');
  const price = document.getElementById('price');
  const city = document.getElementById('city');
  const phone = document.getElementById('phone');
  ads.unshift({
    title:title.value.trim(), category:category.value,
    description:description.value.trim(), price:Number(price.value) || 0,
    city:city.value.trim(), phone:phone.value.trim()
  });
  try {
    localStorage.setItem(storageKey, JSON.stringify(ads));
    form.reset();
    city.value = 'نيالا';
    render();
    alert('تم حفظ الإعلان على هذا الجهاز!');
  } catch {
    ads.shift();
    alert('تعذر حفظ الإعلان. تحقق من إعدادات التخزين في المتصفح.');
  }
});
render();
</script>
</body>
</html>
